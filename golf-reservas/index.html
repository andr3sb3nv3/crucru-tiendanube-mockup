<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas de golf</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #f4f7f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 24px;
      color: #5a6673;
    }

    form,
    .reservations {
      background: #fff;
      border: 1px solid #dce5df;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(31, 45, 35, .06);
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #c7d4cc;
      border-radius: 6px;
      padding: 11px 12px;
      font: inherit;
      background: #fbfdfc;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .app-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .target-switch {
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid #dce5df;
      border-radius: 8px;
      background: #fff;
    }

    .target-switch button {
      color: #2f3b35;
      background: transparent;
    }

    .target-switch button.active {
      color: #fff;
      background: #146b43;
    }

    .hint {
      margin: -6px 0 0;
      color: #647168;
      font-size: 13px;
      font-weight: 700;
    }

    button {
      width: fit-content;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 800;
      color: #fff;
      background: #146b43;
      cursor: pointer;
    }

    button.secondary {
      color: #2f3b35;
      background: #e8efeb;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .reservations {
      margin-top: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 8px;
      border-bottom: 1px solid #edf2ef;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #647168;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      background: #e8efeb;
      font-weight: 800;
      font-size: 12px;
    }

    .message {
      min-height: 22px;
      color: #146b43;
      font-weight: 700;
    }

    .message.problem {
      color: #b42318;
    }

    .error {
      color: #b42318;
      font-size: 12px;
      max-width: 360px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: 1fr;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <h1>Reservas de golf</h1>
        <p>Indicá cuándo querés jugar y a qué hora buscar cancha.</p>
      </div>
    </header>

    <form id="reservation-form">
      <input name="mode" type="hidden" value="production">
      <input name="scheduleKind" type="hidden" value="exact">
      <input name="target" type="hidden" value="golf-tracker">

      <div class="target-switch" aria-label="Cancha">
        <button class="active" id="target-golf-tracker" type="button">Golf Tracker</button>
        <button id="target-jockey-palermo" type="button">Jockey Club</button>
        <button id="target-club-newman" type="button">Club Newman</button>
      </div>

      <div class="grid">
        <label>
          Día que voy a jugar
          <input name="playDate" type="date" required>
        </label>
        <label id="run-date-field">
          Día de la reserva
          <input name="runDate" type="date" required>
        </label>
      </div>

      <div class="grid">
        <label id="run-time-field">
          Hora de la reserva
          <input name="runTime" type="time" step="1" required>
        </label>
        <label>
          Opción/lugar de reserva
          <input name="bookingText" value="practica deportiva feriado">
        </label>
      </div>
      <div class="hint" id="execution-hint"></div>

      <label>
        Matrículas y DNI (hasta 4)
        <textarea name="memberIds" placeholder="Una línea por jugador: matrícula DNI" required>135890
105581 16763366
138121 40388889
130742 39770573</textarea>
      </label>

      <div class="grid">
        <label>
          Desde
          <input name="timeWindowStart" type="time" value="12:30" required>
        </label>
        <label>
          Hasta
          <input name="timeWindowEnd" type="time" value="14:30" required>
        </label>
      </div>

      <div class="actions">
        <button type="submit">Guardar solicitud</button>
        <button class="secondary" id="save-three-days" type="button">Guardar 3 días antes</button>
        <button class="secondary" id="save-two-days" type="button">Guardar 2 días antes</button>
        <button class="secondary" id="run-now" type="button">Generar solicitud ahora</button>
      </div>
      <div class="message" id="message"></div>
    </form>

    <section class="reservations">
      <button class="secondary" id="refresh" type="button">Actualizar</button>
      <table>
        <thead>
          <tr>
            <th>Juego</th>
            <th>Ejecución</th>
            <th>Jugadores</th>
            <th>Horario</th>
            <th>Estado</th>
            <th>Último paso</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="reservations"></tbody>
      </table>
    </section>
  </main>

  <script>
    const form = document.querySelector("#reservation-form");
    const tbody = document.querySelector("#reservations");
    const message = document.querySelector("#message");
    const runNowButton = document.querySelector("#run-now");
    const saveThreeDaysButton = document.querySelector("#save-three-days");
    const saveTwoDaysButton = document.querySelector("#save-two-days");
    const golfTrackerButton = document.querySelector("#target-golf-tracker");
    const jockeyPalermoButton = document.querySelector("#target-jockey-palermo");
    const clubNewmanButton = document.querySelector("#target-club-newman");
    const executionHint = document.querySelector("#execution-hint");
    const targetDefaults = {
      "golf-tracker": {
        bookingText: "practica deportiva feriado",
        memberIds: "135890\n105581 16763366\n138121 40388889\n130742 39770573",
        timeWindowStart: "12:30",
        timeWindowEnd: "14:30"
      },
      "jockey-palermo": {
        bookingText: "AZUL",
        memberIds: "135890",
        timeWindowStart: "12:30",
        timeWindowEnd: "14:30"
      },
      "club-newman": {
        bookingText: "",
        memberIds: "135890",
        timeWindowStart: "12:30",
        timeWindowEnd: "14:30"
      }
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      await createReservation("/api/reservations", "Guardado", "exact");
    });

    runNowButton.addEventListener("click", async () => {
      await createReservation("/api/reservations/run-now", "Solicitud creada y ejecutándose ahora", "exact");
    });

    saveThreeDaysButton.addEventListener("click", async () => {
      await createReservation("/api/reservations", "Guardado 3 días antes a las 08:00", "days-3");
    });
    saveTwoDaysButton.addEventListener("click", async () => {
      await createReservation("/api/reservations", "Guardado 2 días antes a las 08:00", "days-2");
    });
    golfTrackerButton.addEventListener("click", () => setTarget("golf-tracker"));
    jockeyPalermoButton.addEventListener("click", () => setTarget("jockey-palermo"));
    clubNewmanButton.addEventListener("click", () => setTarget("club-newman"));
    form.playDate.addEventListener("change", syncExecutionHint);

    async function createReservation(url, successPrefix, scheduleKind) {
      setBusy(true);
      try {
        const data = Object.fromEntries(new FormData(form).entries());
        data.mode = "production";
        data.scheduleKind = scheduleKind;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const payload = await readJsonResponse(response);
        if (!response.ok) {
          setMessage(payload.error || `No se pudo guardar. HTTP ${response.status}`, true);
          return;
        }
        setMessage(`${successPrefix}. Se intentará realizar la reserva el ${formatRunAt(payload)}.`);
        form.reset();
        setTarget("golf-tracker");
        setDefaultRunAt();
        syncExecutionHint();
        await loadReservations();
      } catch (error) {
        setMessage(`No se pudo guardar: ${error.message || error}`, true);
      } finally {
        setBusy(false, { keepMessage: true });
      }
    }

    async function readJsonResponse(response) {
      const text = await response.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch {
        return { error: text.slice(0, 500) };
      }
    }

    async function loadReservations() {
      try {
        const response = await fetch("/api/reservations", { cache: "no-store" });
        const reservations = await readJsonResponse(response);
        if (!response.ok) {
          setMessage(reservations.error || `No pude actualizar solicitudes. HTTP ${response.status}`, true);
          return;
        }
        tbody.innerHTML = reservations.map((reservation) => `
          <tr>
            <td>${escapeHtml(reservation.playDate)}${reservation.target ? `<br>${escapeHtml(formatTarget(reservation.target))}` : ""}</td>
            <td>${escapeHtml(formatRunAt(reservation))}</td>
            <td>${escapeHtml(formatPlayers(reservation))}</td>
            <td>${escapeHtml(reservation.timeWindowStart)}-${escapeHtml(reservation.timeWindowEnd)}</td>
            <td><span class="status">${escapeHtml(formatStatus(reservation.status))}</span></td>
            <td class="error">${escapeHtml(formatLastStatus(reservation))}</td>
            <td>
              <div class="actions">
                ${reservation.reservationWriteStarted
                  ? '<span class="status">Enviado al sitio</span>'
                  : `<button class="secondary" type="button" data-run="${escapeHtml(reservation.id)}">Intentar ahora</button>`}
                <button class="secondary" type="button" data-delete="${escapeHtml(reservation.id)}">Borrar</button>
              </div>
            </td>
          </tr>
        `).join("");
      } catch (error) {
        setMessage(`No pude actualizar solicitudes: ${error.message || error}`, true);
      }
    }

    async function loadHealth() {
      try {
        const response = await fetch("/api/health", { cache: "no-store" });
        const health = await readJsonResponse(response);
        if (response.ok && health.storage && !health.storage.durable) {
          setMessage("Las solicitudes programadas están deshabilitadas hasta vincular PostgreSQL en Railway. Generar solicitud ahora sigue disponible.", true);
        }
      } catch {
        // La tabla mostrará el error de conexión si el backend no está disponible.
      }
    }

    document.querySelector("#refresh").addEventListener("click", loadReservations);

    tbody.addEventListener("click", async (event) => {
      const deleteId = event.target.dataset.delete;
      const runId = event.target.dataset.run;
      if (runId) {
        const response = await fetch(`/api/reservations/${encodeURIComponent(runId)}/run-now`, { method: "POST" });
        const payload = await readJsonResponse(response);
        if (!response.ok) setMessage(payload.error || `No pude iniciar la solicitud. HTTP ${response.status}`, true);
        await loadReservations();
        return;
      }
      if (!deleteId) return;
      await fetch(`/api/reservations/${encodeURIComponent(deleteId)}`, { method: "DELETE" });
      await loadReservations();
    });

    function setBusy(isBusy, options = {}) {
      form.querySelectorAll("button").forEach((button) => {
        button.disabled = isBusy;
      });
      if (isBusy) {
        setMessage("Procesando...");
      } else if (!options.keepMessage) {
        setMessage("");
      }
    }

    function setMessage(text, isProblem = false) {
      message.textContent = text;
      message.classList.toggle("problem", isProblem);
    }

    function formatPlayers(reservation) {
      if (Array.isArray(reservation.playerData) && reservation.playerData.length) {
        return reservation.playerData
          .map((player) => [player.memberId, player.documentId].filter(Boolean).join(" / "))
          .join(", ");
      }
      return reservation.memberIds.join(", ");
    }

    function formatTarget(target) {
      if (target === "club-newman") return "Club Newman";
      return target === "jockey-palermo" ? "Jockey Club" : "Golf Tracker";
    }

    function formatStatus(status) {
      return {
        pending: "pendiente",
        starting: "iniciando",
        running: "ejecutando",
        done: "completada",
        failed: "fallida",
        dry_run: "prueba correcta"
      }[status] || status;
    }

    function formatRunAt(reservation) {
      if (reservation.runDate && reservation.runTime) return `${reservation.runDate} ${reservation.runTime}`;
      if (reservation.runAtLocal) return reservation.runAtLocal.replace("T", " ");
      if (reservation.bookingOpenDate) return `${reservation.bookingOpenDate} 08:00`;
      return "";
    }

    function formatLastStatus(reservation) {
      if (reservation.lastError) return reservation.lastError;
      const log = [reservation.lastStderr, reservation.lastStdout].filter(Boolean).join("\n");
      const lines = log
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean)
        .filter((line) => !line.startsWith(">"));
      return lines.slice(-6).join("\n");
    }

    function setDefaultRunAt() {
      const now = new Date();
      now.setSeconds(now.getSeconds() + 20);
      form.runDate.value = toDateValue(now);
      form.runTime.value = toTimeValue(now);
    }

    function setTarget(target) {
      form.target.value = target;
      const isJockey = target === "jockey-palermo";
      const isNewman = target === "club-newman";
      golfTrackerButton.classList.toggle("active", !isJockey && !isNewman);
      jockeyPalermoButton.classList.toggle("active", isJockey);
      clubNewmanButton.classList.toggle("active", isNewman);

      const defaults = targetDefaults[target] || targetDefaults["golf-tracker"];
      form.bookingText.value = defaults.bookingText;
      form.memberIds.value = defaults.memberIds;
      form.timeWindowStart.value = defaults.timeWindowStart;
      form.timeWindowEnd.value = defaults.timeWindowEnd;
      syncExecutionHint();
    }

    function syncExecutionHint() {
      executionHint.textContent = `Reservas reales en ${formatTarget(form.target.value)}.`;
    }

    function toDateValue(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function toTimeValue(date) {
      return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}:${String(date.getSeconds()).padStart(2, "0")}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    setTarget("golf-tracker");
    setDefaultRunAt();
    loadHealth();
    loadReservations();
    setInterval(loadReservations, 1000);
  </script>
</body>
</html>
